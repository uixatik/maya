ShortDescription: Fast, resilient multi-protocol CLI, daemon, and TUI downloader written in Rust.
Description: |
  Maya is a high-performance, resilient multi-protocol download manager supporting
  segmented multi-connection HTTP/HTTPS, HLS and MPEG-DASH streaming media extraction
  with yt-dlp and ffmpeg, BitTorrent/magnet transfers, an interactive Ratatui TUI,
  a background daemon service with persistent SQLite queue, and browser extension
  integration via Native Messaging Host.

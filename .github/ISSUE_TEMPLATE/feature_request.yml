name: 🚀 Feature Request
description: Suggest an idea or enhancement for Maya Downloader
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We appreciate suggestions and proposals to make Maya more capable and faster!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Limitation
      description: Is your feature request related to a problem or missing capability?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you would like this feature to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative approaches or workarounds you've considered.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or protocol documentation here.

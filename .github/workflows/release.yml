name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_name: maya-${{ github.ref_name }}-windows-x86_64.zip
            bin_suffix: .exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive_name: maya-${{ github.ref_name }}-linux-x86_64.tar.gz
            bin_suffix: ''
          - target: x86_64-apple-darwin
            os: macos-13
            archive_name: maya-${{ github.ref_name }}-darwin-x86_64.tar.gz
            bin_suffix: ''
          - target: aarch64-apple-darwin
            os: macos-14
            archive_name: maya-${{ github.ref_name }}-darwin-aarch64.tar.gz
            bin_suffix: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p maya-cli -p maya-daemon -p maya-nmh

      - name: Package Windows Artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $StageDir = "stage/maya-${{ github.ref_name }}-windows-x86_64"
          New-Item -ItemType Directory -Path $StageDir -Force | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/maya.exe" -Destination $StageDir
          Copy-Item "target/${{ matrix.target }}/release/mayad.exe" -Destination $StageDir
          Copy-Item "target/${{ matrix.target }}/release/maya-nmh.exe" -Destination $StageDir

          Copy-Item "install.ps1" -Destination $StageDir
          Copy-Item "README.md" -Destination $StageDir
          Copy-Item "LICENSE" -Destination $StageDir
          Copy-Item "extensions" -Destination $StageDir -Recurse

          Compress-Archive -Path "$StageDir\*" -DestinationPath "${{ matrix.archive_name }}" -Force
          $Hash = (Get-FileHash -Path "${{ matrix.archive_name }}" -Algorithm SHA256).Hash.ToLower()
          "$Hash  ${{ matrix.archive_name }}" | Out-File -FilePath "${{ matrix.archive_name }}.sha256" -Encoding ascii

      - name: Package Unix Artifacts
        if: matrix.os != 'windows-latest'
        run: |
          STAGE_DIR="stage/maya-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$STAGE_DIR"

          cp "target/${{ matrix.target }}/release/maya" "$STAGE_DIR/"
          cp "target/${{ matrix.target }}/release/mayad" "$STAGE_DIR/"
          cp "target/${{ matrix.target }}/release/maya-nmh" "$STAGE_DIR/"

          cp "install.sh" "$STAGE_DIR/"
          cp "README.md" "$STAGE_DIR/"
          cp "LICENSE" "$STAGE_DIR/"
          cp -r "extensions" "$STAGE_DIR/"

          tar -czf "${{ matrix.archive_name }}" -C "$STAGE_DIR" .
          shasum -a 256 "${{ matrix.archive_name }}" > "${{ matrix.archive_name }}.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS.txt
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          ls -lah

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
